debug: false

# Prefix frontend messages in the router (Go time layout; includes separator).
timestamp:
  enabled: true
  timezone: "UTC" # e.g. Europe/London or Asia/Shanghai
  format: "[2006-01-02 15:04:05 MST] "

# Frontend instances. The name ("tg") is used in routes and environment
# overrides; owner is the bound user in the adapter's address format.
frontends:
  tg:
    type: telegram
    # owner: "123456789"   # usually set via ROUTER_FRONTENDS__TG__OWNER
    options:               # token via ROUTER_FRONTENDS__TG__OPTIONS__TOKEN
      system_prefix: "𝑴𝒆𝒐𝒘☕︎" # Set to "" to keep only the System label.
      system_style: auto      # full | compact | auto (one-line header for single-line notices)
      voice_max_seconds: 60
    # ingress:             # only for webhook-based adapters (Telegram uses polling)
    #   path: /hooks/tg

# Frontends whose owner receives startup/shutdown notices.
lifecycle_notify: [tg]

backends:
  default:
    type: pi
    command: ["pi", "--mode", "rpc"]
    # session_file: /home/node/.pi/agent/sessions/example.jsonl

routes:
  - from: "tg:*"
    to: "pi:default"

stream:
  separators: ["\n", "<break />"]
  show_tool_calls:
    enabled: true
    detailed: true            # append the command/path to "Tool started" notices
    max_detail_length: 120    # runes; longer details are clipped with …

media:
  dir: /data/media
  inline_image_max_mb: 5
  ttl: 24h

api:
  listen: "127.0.0.1:8080"
mcp:
  listen: "127.0.0.1:8081"
  tools:
    # send_file is always available. send_voice lets the agent speak: text is
    # synthesized and sent as a voice message (as a file if over 60 s).
    send_voice:
      enabled: false
      style:
        enabled: true      # offer the agent a per-message "style" (emotion, mood, pace)
        base: ""           # fixed delivery notes; the agent's style is appended
      provider:
        type: openai_speech   # any OpenAI-compatible /audio/speech endpoint
        options:              # api_key via ROUTER_MCP__TOOLS__SEND_VOICE__PROVIDER__OPTIONS__API_KEY
          base_url: https://openrouter.ai/api/v1
          model: openai/gpt-4o-mini-tts-2025-12-15
          voice: nova
          response_format: mp3   # mp3 | opus (OpenRouter: mp3)
          speed: 0               # 0 omits the field
          # Where style text goes in the request body (dot path). OpenRouter
          # and OpenAI use "instructions"; only some models honour it (e.g.
          # gpt-4o-mini-tts, Gemini TTS), so check yours or disable style.
          style_field: instructions
          extra_body: {}         # merged into every request
          timeout: 60s
          # DeepInfra instead:
          # base_url: https://api.deepinfra.com/v1/openai
          # model: hexgrad/Kokoro-82M
          # voice: af_bella
          # (Kokoro has no style support: set style.enabled: false)
# Public webhook listener; started only if a frontend declares ingress.path.
# ingress:
#   listen: "0.0.0.0:8443"

prompts:
  attachment: "[attachment: {path} ({mime}, {size})]"

queue_limit: 256
plugins: []
# plugins:
