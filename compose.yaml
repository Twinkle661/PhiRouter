services:
  router:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      ROUTER_API__LISTEN: "0.0.0.0:8080"
    volumes:
      - pi-agent:/home/node/.pi/agent
      - media:/data/media
      - state:/data/state
      - ./config.yaml:/app/config.yaml:ro
    # Reachable by other containers on this network, not published to the host.
    expose:
      - "8080"

volumes:
  pi-agent:
  media:
  state:
